name: agrovision
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: agrovision
      POSTGRES_USER: agrovision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_local.py}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovision -d agrovision"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
