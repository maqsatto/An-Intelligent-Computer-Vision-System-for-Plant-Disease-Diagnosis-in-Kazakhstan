name: Verify MVP
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: agrovision
          POSTGRES_USER: agrovision
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrovision -d agrovision"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      AGRO_DATABASE_URL: postgresql+psycopg://agrovision:ci-only-disposable-password@127.0.0.1:5432/agrovision
      AGRO_ENVIRONMENT: test
      AGRO_DEV_TOKEN_SECRET: ci-only-disposable-token-key-not-used-outside-ci
      AGRO_DOWNLOAD_SECRET: ci-only-disposable-photo-key-not-used-outside-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: pip install uv==0.12.1
      - run: uv sync --frozen
      - run: uv run ruff check server tests scripts ml
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/export_openapi.py && pnpm generate:client
      - run: git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts
      - run: pnpm typecheck && pnpm test:mobile
      - run: pnpm --filter @agrovision/mobile exec expo export --platform android --output-dir dist
