[project]
name = "agrovision-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.6.0", "torchvision==0.21.0", "pillow>=11.1,<12", "numpy>=2.2,<2.3", "onnx==1.17.0", "onnxruntime>=1.21,<1.22", "scikit-learn>=1.6,<1.7"]
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
