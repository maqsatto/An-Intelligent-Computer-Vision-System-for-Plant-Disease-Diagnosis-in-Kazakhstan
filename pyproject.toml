[project]
name = "agrovision"
version = "0.1.0"
description = "AgroVision modular API and durable worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35", "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<3.3", "alembic>=1.15,<1.16", "pydantic-settings>=2.8,<2.9",
  "python-multipart>=0.0.20,<0.1", "pillow>=11.1,<12", "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<0.29", "numpy>=2.2,<2.3", "onnxruntime>=1.21,<1.22"
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12", "onnx>=1.17,<1.18"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["server/agrovision", "ml/runtime/agrovision_runtime"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "ml/runtime"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
